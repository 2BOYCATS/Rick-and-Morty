<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <title>Rick & Morty</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Rick and Morty Characters</h1>
            <form id="searchUser">
                <input type="text" nmae="q" id="query" class="input-name" placeholder="Professor Sanchez" autofocus autocomplete="off">
                <button class="btn-find" type="submit">FIND</button>
            </form>
        </div>

        <div class="card">
            <img id="character-img" src="https://rickandmortyapi.com/api/character/avatar/619.jpeg" alt="">
            <div class="card-body">
                <h5 class="card-title" id="character-name">Professor Sanchez</h5>
                <p class="card-text" id="character-type">Soulless Puppet</p>
            </div>
        </div>
    </div>

    <script src="scripts/app.js"></script>
</body>
</html>
